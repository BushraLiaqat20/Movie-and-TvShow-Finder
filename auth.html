<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieVerse | Authentication</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h1 class="logo">🎬 MovieVerse</h1>
      
      <div class="tab-box">
        <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Sign Up</button>
      </div>

      <p id="authError" class="auth-error"></p>
      <p id="authSuccess" class="auth-success"></p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="name@example.com" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <div class="input-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required>
        </div>
        <div class="input-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="name@example.com" required>
        </div>
        <div class="input-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
